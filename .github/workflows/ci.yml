name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pos-package:
    name: "POS package: manifest matches the files, signature valid"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project scripts/sign_pos.py --check

  cli:
    name: "posctl: clippy and tests"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  pos-integration:
    name: "POS package: integration tests as SYSTEM (windows-latest)"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Every POS script is ASCII and parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem pos, tests\pos -Recurse -Filter *.ps1) {
            if ([IO.File]::ReadAllBytes($file.FullName) | Where-Object { $_ -gt 127 }) { "$($file.FullName): not ASCII"; $bad++ }
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { "$($file.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          exit [int]($bad -gt 0)

      - name: tests\pos\Invoke-Tests.ps1
        shell: powershell
        env:
          POS_TUNNEL_DISPOSABLE: "1"
        run: .\tests\pos\Invoke-Tests.ps1

      - name: Get-WinEvent OpenSSH/Operational (on failure)
        if: failure()
        shell: powershell
        run: Get-WinEvent -LogName OpenSSH/Operational -MaxEvents 300 -ErrorAction SilentlyContinue | Sort-Object TimeCreated | ForEach-Object { "$($_.TimeCreated.ToString('HH:mm:ss')) $($_.Message)" }

  cli-integration:
    name: "posctl: relay setup integration tests (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      # --no-project: the dev group comes from the private index, which CI can't reach. It also skips
      # requires-python, so pin 3.14, whose lazy annotations the tests' TYPE_CHECKING imports need.
      - name: uv run --no-project --python 3.14 pytest tests/cli
        env:
          POS_TUNNEL_DOCKER: "1"
        run: uv run --no-project --python 3.14 --with pytest --with pytest-cov --with pytest-asyncio pytest tests/cli
