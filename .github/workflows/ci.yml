name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pos-package:
    name: "POS package: manifest matches the files, signature valid"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project scripts/sign_pos.py --check

  cli:
    name: "posctl: clippy and tests"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
