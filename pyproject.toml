[project]
  name            = "pos-tunnel"
  version         = "0.1.0"
  description     = "On-demand SSH access to NinjaOne-managed Windows POS machines through a hardened relay"
  readme          = "README.md"
  requires-python = ">=3.14"
  # The wheel carries only the Rust `posctl` binary (maturin `bindings = "bin"`); no Python code.
  dependencies    = []

[dependency-groups]
  dev = ["aeth-devkit", "devkit-claude-hooks>=1.0.0", "devkit-poe-complete>=1.1.0", "devkit-templates>=1.3.0", "poethepoet>=0.46.0", "pyright>=1.1.411", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.15", "tombi>=1.5"]  # setup-project added: "devkit-claude-hooks", "devkit-poe-complete", "poethepoet>=0.46.0", "pyright>=1.1.411", "pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.15", "tombi>=1.5"

[build-system]
  requires      = ["maturin>=1.7,<2"]
  build-backend = "maturin"

[tool.coverage]
  [tool.coverage.run]
    data_file   = ".cache/.coverage"
    source_pkgs = ["pos_tunnel"]

  [tool.coverage.report]
    show_missing = true

  [tool.coverage.html]
    directory = ".cache/htmlcov"

  [tool.coverage.xml]
    output = ".cache/coverage.xml"

  [tool.coverage.lcov]
    output = ".cache/coverage.lcov"

[tool.docker]
  # relay/ is a hand-written image: its sshd must run as root, which devkit-container's
  # drop-to-999 model excludes (docs/design.md, section 6.1).
  silence_unlisted_services_warning = true
  # Compose services setup-project validates against the standard; the only Docker switch.
  # Empty = no Docker handling. Side services are simply not listed.
  services                          = []
  # Paths relative to /app the entrypoint guarantees exist, are backed by a bind mount (the
  # path itself or an ancestor) and are owned by nonroot. Sub-paths of a mount are created
  # on the mounted filesystem. Ephemeral scratch dirs do not belong here (or under /app at
  # all): use tempfile paths.
  required_persisted_dirs           = ["persisted_data"]
  # The two devkit-container run modes, each added only when missing so a project's own
  # value stands (a plain template scalar would replace it).
  # Spawn and supervise the app instead of exec'ing it.
  supervise                         = false
  # Bring the tunnel up (the WG_* environment) before the app; implies supervise, and gates
  # the wireguard parts of the Dockerfile and compose templates.
  wireguard                         = false

[tool.maturin]
  bindings      = "bin"
  manifest-path = "cli/Cargo.toml"

[tool.devkit]
  # Attaches the signed POS package to each release (docs/design.md, section 7.1).
  release-workflow-jobs = ["pos-package"]

[tool.poe]
  include_script = [{ script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }]

  [tool.poe.tasks]
    sign-pos = { cmd = "python scripts/sign_pos.py", help = "Re-sign pos/manifest.json after pos/package changes (needs POS_TUNNEL_SIGNING_KEY)" }

[tool.pyright]
  typeCheckingMode = "standard"

  verboseOutput          = true
  useLibraryCodeForTypes = true

  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true
  deprecateTypingAliases      = true

  reportPropertyTypeMismatch          = true
  reportMissingTypeStubs              = false
  reportImportCycles                  = true
  reportUntypedFunctionDecorator      = true
  reportUntypedClassDecorator         = true
  reportUntypedNamedTuple             = true
  reportPrivateUsage                  = true
  # reportConstantRedefinition          = true
  reportDeprecated                    = true
  # reportMissingSuperCall              = true
  reportUninitializedInstanceVariable = true
  reportMissingParameterType          = true
  # reportMissingTypeArgument           = true
  reportUnnecessaryIsInstance         = true
  reportUnnecessaryCast               = true
  reportUnnecessaryComparison         = true
  reportUnnecessaryContains           = true
  reportInvalidStubStatement          = true
  reportUnnecessaryTypeIgnoreComment  = true
  reportMatchNotExhaustive            = true
  reportUnreachable                   = true
  reportImplicitOverride              = true
  reportMissingTypeArgument           = false

  executionEnvironments = [{ root = "src", extraPaths = ["src"] }]

[tool.pytest.ini_options]
  addopts      = [
    "--cov",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
    "-ra",
  ]
  cache_dir    = ".cache/pytest"
  testpaths    = ["tests"]
  xfail_strict = true
  asyncio_mode = "auto"

[tool.ruff]
  cache-dir = ".cache/ruff"
  # Sister projects' packages count as first-party (ruff `src` supports globs).
  src       = ["./src", "../*/src", "../*/python"]

  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "dist",
    "node_modules",
    "venv",
  ]

  fix = true

  indent-width = 2
  line-length  = 135

  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    extend-select = [
      "A",
      "ANN001",
      "ASYNC",
      "B",
      "C4",
      "C90",
      "D",
      "DTZ",
      "FBT003",
      "LOG",
      "N",
      "NPY",
      "PD",
      "PERF",
      "PL",
      "PYI",
      "RUF",
      "T10",
      "TC",
      "TID",
      "UP",
    ]
    ignore        = [
      "A004",
      "PD008",
      "PD009",
      "PLC0415",
      "PLR0913",
      "PLW0603",
      "PIE790",
    ]

    [tool.ruff.lint.flake8-tidy-imports.banned-api]
      # Delivered by ruff exactly when violated, so the reasoning costs no context otherwise.
      "__future__.annotations".msg = "Python 3.14 evaluates all annotations lazily (PEP 649) with or without this import. What it adds is PEP 563 stringification, which breaks pydantic, dataclasses.fields() introspection, and typing.get_type_hints."

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.per-file-ignores]
      # No missing-docstring rules in tests: a test's name is its summary, and test docstrings
      # read to agents as statements of intent that were never reviewed. D2xx+ still apply to
      # docstrings a test does have.
      "tests/**" = ["D1"]

    [tool.ruff.lint.isort]
      combine-as-imports = true
      known-first-party  = ["pos_tunnel"]

      [tool.ruff.lint.isort.import-heading]
        first-party      = "First party imports"
        future           = "Future imports"
        local-folder     = "Local folder imports"
        standard-library = "Standard library imports"
        third-party      = "Third party imports"

[tool.tombi]
  toml-version = "v1.1.0"

  [tool.tombi.files]
    exclude = [
      ".bzr",
      ".direnv",
      ".eggs",
      ".git",
      ".git-rewrite",
      ".hg",
      ".mypy_cache",
      ".nox",
      ".pants.d",
      ".pytype",
      ".ruff_cache",
      ".svn",
      ".tox",
      ".venv",
      "__pypackages__",
      "_build",
      "buck-out",
      "dist",
      "node_modules",
      "venv",
    ]

  [tool.tombi.format.rules]
    indent-sub-tables               = true
    indent-table-key-value-pairs    = true
    key-value-equals-sign-alignment = true
    trailing-comment-alignment      = true

[tool.uv.sources]
  aeth-devkit         = [{ index = "SFTPyPI" }]
  devkit-templates    = [{ index = "SFTPyPI" }]
  devkit-claude-hooks = [{ index = "SFTPyPI" }]
  devkit-poe-complete = [{ index = "SFTPyPI" }]

[[tool.uv.index]]
  name        = "SFTPyPI"
  url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
  publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
  explicit    = true
